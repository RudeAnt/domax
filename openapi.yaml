openapi: 3.0.0
paths:
  /api:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /api/tickets:
    post:
      operationId: TicketsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Создать заявку
      tags:
        - Tickets
    get:
      operationId: TicketsController_findAll
      parameters:
        - name: address
          required: true
          in: query
          schema:
            type: string
        - name: status
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Получить список заявок (лента дома / очередь диспетчера)
      tags:
        - Tickets
  /api/tickets/{id}:
    get:
      operationId: TicketsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Получить заявку по ID
      tags:
        - Tickets
    delete:
      operationId: TicketsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      summary: Удалить свою заявку (только пока статус CREATED)
      tags:
        - Tickets
  /api/tickets/{id}/status:
    patch:
      operationId: TicketsController_updateStatus
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Изменить статус заявки (в работу / закрыть)
      tags:
        - Tickets
  /api/tickets/{id}/upvote:
    post:
      operationId: TicketsController_upvote
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: «У меня так же» — отметить дублирующуюся проблему
      tags:
        - Tickets
  /api/auth/dev-login:
    post:
      operationId: AuthController_devLogin
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginDto'
      responses:
        '201':
          description: ''
      summary: Мгновенный логин под ролью (только для демо/жюри)
      tags:
        - Auth
  /api/auth/max:
    post:
      operationId: AuthController_loginWithMax
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxAuthDto'
      responses:
        '201':
          description: ''
      summary: Логин через initData из MAX WebApp
      tags:
        - Auth
  /api/users/me:
    get:
      operationId: UsersController_getMe
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Профиль текущего авторизованного пользователя
      tags:
        - Users
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Указать/изменить адрес и квартиру в своём профиле
      tags:
        - Users
  /api/announcements:
    get:
      operationId: AnnouncementsController_findAll
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Список объявлений УК для баннера на главной
      tags:
        - Announcements
    post:
      operationId: AnnouncementsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Создать объявление (УК/диспетчер)
      tags:
        - Announcements
  /api/announcements/{id}:
    delete:
      operationId: AnnouncementsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      summary: Удалить объявление (УК/диспетчер)
      tags:
        - Announcements
info:
  title: Дом.MAX API
  description: API сервиса управления домом
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://domax.46.29.167.230.sslip.io
    description: Production Server
  - url: http://localhost:3000
    description: Local Dev Server
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateTicketDto:
      type: object
      properties:
        title:
          type: string
          example: Течёт потолок в ванной
        category:
          type: string
          enum:
            - PLUMBING
            - ELECTRICS
            - ELEVATOR
            - COMMON_AREA
            - OTHER
          example: PLUMBING
        description:
          type: string
          example: Течёт потолок в ванной, вода с соседнего этажа
        address:
          type: string
          example: ул. Тестовая, д. 1
        apartment:
          type: number
          example: 12
        photoUrl:
          type: string
          example: https://example.com/photo.jpg
        entrance:
          type: number
          example: 2
        floor:
          type: number
          example: 3
      required:
        - title
        - category
        - description
        - address
    UpdateTicketStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - CREATED
            - IN_PROGRESS
            - COMPLETED
            - CLOSED
          example: IN_PROGRESS
      required:
        - status
    DevLoginDto:
      type: object
      properties: {}
    MaxAuthDto:
      type: object
      properties: {}
    UpdateProfileDto:
      type: object
      properties:
        address:
          type: string
          example: ул. Тестовая, д. 1
        apartment:
          type: number
          example: 12
    CreateAnnouncementDto:
      type: object
      properties:
        title:
          type: string
          example: Плановое отключение воды
        body:
          type: string
          example: >-
            27 сентября с 10:00 до 14:00 будет отключена холодная вода на всём
            доме.
      required:
        - title
        - body
