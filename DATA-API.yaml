version: "1.0"
solution_name: "DOMAX"
team_name: "DOMAX Team"
base_url: "https://domax.46.29.167.230.sslip.io/api"

checks:
  # 1. Проверка доступности сервиса
  - name: "Health check"
    method: GET
    path: "/"
    role: "ANONYMOUS"
    expected_status: [200]

  # 2. Мгновенная авторизация тестового пользователя (Житель)
  - name: "Auth as Resident"
    method: POST
    path: "/auth/dev-login"
    role: "RESIDENT"
    request:
      body:
        role: "RESIDENT"
    expected_status: [200, 201]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "accessToken"
        - "user"

  # 3. Получение профиля жителя
  - name: "Get Resident Profile"
    method: GET
    path: "/users/me"
    role: "RESIDENT"
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "id"
        - "address"
        - "role"

  # 4. Создание заявки жителем
  - name: "Create Ticket"
    method: POST
    path: "/tickets"
    role: "RESIDENT"
    request:
      body:
        title: "Тестовая заявка для проверки жюри"
        description: "Проверка работы автоматических тестов API"
        category: "PLUMBING"
        address: "ул. Ленина, д. 10"
        entrance: 1
        floor: 3
    expected_status: [201]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "id"
        - "title"
        - "status"

  # 5. Получение списка заявок по дому
  - name: "List Tickets by Address"
    method: GET
    path: "/tickets"
    role: "RESIDENT"
    request:
      query:
        address: "ул. Ленина, д. 10"
    expected_status: [200]
    expected_response:
      content_type: "application/json"

  # 6. Получение объявлений УК
  - name: "List Announcements"
    method: GET
    path: "/announcements"
    role: "RESIDENT"
    expected_status: [200]
    expected_response:
      content_type: "application/json"

  # 7. Авторизация под диспетчером
  - name: "Auth as Dispatcher"
    method: POST
    path: "/auth/dev-login"
    role: "DISPATCHER"
    request:
      body:
        role: "DISPATCHER"
    expected_status: [200, 201]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "accessToken"

