services:
  postgres:
    image: postgres:16-alpine
    container_name: domax_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: domax
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - domax_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: domax_backend
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: rootpassword
      DATABASE_NAME: domax
      JWT_SECRET: ${JWT_SECRET}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - domax_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: domax_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=https://domax.46.29.167.230.sslip.io/api
    depends_on:
      - backend
    networks:
      - domax_net

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: domax_bot
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MINI_APP_URL: ${MINI_APP_URL:-https://domax.46.29.167.230.sslip.io}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      NOTIFY_SECRET: ${NOTIFY_SECRET}
      NOTIFY_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./bot:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - domax_net

  caddy:
    image: caddy:2-alpine
    container_name: domax-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - domax_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  domax_net:
    driver: bridge

