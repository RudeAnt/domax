services:
  postgres:
    image: postgres:16-alpine
    container_name: domax_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: domax
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - domax_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: domax_backend
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: rootpassword
      DATABASE_NAME: domax
      JWT_SECRET: ${JWT_SECRET}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - domax_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: domax_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - domax_net

volumes:
  pgdata:

networks:
  domax_net:
    driver: bridge

